services:
  goals-api:
    container_name: goals-api
    image: nikosdmthom/mylifecoach/goals-api:latest
    restart: "unless-stopped"
    build:
      context: .
      dockerfile: src/Apis/goals-api/Goals.Api/Dockerfile
    environment:
      - ASPNETCORE_HTTP_PORTS=3000
    ports:
      - "3000:3000"
      - "3300:3300"
    networks:
      - nthom-network

  identity-server:
    container_name: identity-server
    image: nikosdmthom/mylifecoach/identity-server:latest
    restart: "unless-stopped"
    build:
      context: .
      dockerfile: src/Apis/identity-server/identityServer/Dockerfile
    environment:
      - ASPNETCORE_HTTP_PORTS=3010
    ports:
      - "3010:3010"
      - "3310:3310"
    networks:
      - nthom-network

  profiles-api:
    container_name: profiles-api
    image: nikosdmthom/mylifecoach/profiles-api:latest
    restart: "unless-stopped"
    build:
      context: .
      dockerfile: src/Apis/profiles-api/Profiles.Api/Dockerfile
    environment:
      - ASPNETCORE_HTTP_PORTS=3020
    ports:
      - "3020:3020"
      - "3320:3320"
    networks:
      - nthom-network

networks:
  nthom-network:
    external: true
